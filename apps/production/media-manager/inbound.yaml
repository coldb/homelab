apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: media-manager
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: media-manager
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
          podSelector:
            matchLabels:
              tailscale.com/parent-resource-type: ingress
              tailscale.com/parent-resource: media-manager-web
              tailscale.com/parent-resource-ns: media-manager
      ports:
        - protocol: TCP
          port: 3000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 4001
