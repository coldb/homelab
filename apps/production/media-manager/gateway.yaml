apiVersion: v1
kind: Service
metadata:
  name: media-manager-gateway
spec:
  selector:
    app.kubernetes.io/name: media-manager
  ports:
    - port: 4001
      targetPort: gateway
      name: gateway
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: media-manager-gateway
spec:
  dnsNames: [media-manager-agents.colddev.net]
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  secretName: media-manager-gateway-tls
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: media-manager-gateway
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  rules:
    - host: media-manager-agents.colddev.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: media-manager-gateway
                port:
                  name: gateway
  tls:
    - hosts: [media-manager-agents.colddev.net]
      secretName: media-manager-gateway-tls
