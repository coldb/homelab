apiVersion: batch/v1
kind: Job
metadata:
  name: planner-migrate
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  # Retain completion as Flux's release barrier; no TTL deletion/re-execution.
  template:
    metadata:
      labels:
        app: planner-migrations
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: planner-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: planner-release-image
          imagePullPolicy: IfNotPresent
          workingDir: /app/apps/web
          command: [node, /app/launch.mjs, migrate]
          env:
            - name: PGHOST
              value: planner-db-rw.planner.svc.cluster.local
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: planner-migrations-db
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: planner-migrations-db
                  key: password
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: db-ca
              mountPath: /etc/planner-db
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: db-ca
          secret:
            secretName: planner-db-ca
            items:
              - key: ca.crt
                path: ca.crt
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
