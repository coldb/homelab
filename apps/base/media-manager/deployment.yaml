apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-manager
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: media-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: media-manager
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: docker-registry-auth
      initContainers:
        - name: migrate
          image: media-manager-main
          args: [migrate]
          securityContext: &restricted
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: DATABASE_URI
              valueFrom:
                secretKeyRef:
                  name: media-manager-db-app
                  key: uri
            - name: DATABASE_URL
              value: $(DATABASE_URI)?sslmode=verify-full
            - name: NODE_EXTRA_CA_CERTS
              value: /var/run/media-manager-postgres/ca.crt
          volumeMounts:
            - &postgres-ca
              name: postgres-ca
              mountPath: /var/run/media-manager-postgres
              readOnly: true
      containers:
        - name: web
          image: media-manager-main
          args: [web]
          securityContext: *restricted
          env:
            - name: DATABASE_URI
              valueFrom:
                secretKeyRef:
                  name: media-manager-db-app
                  key: uri
            - name: DATABASE_URL
              value: $(DATABASE_URI)?sslmode=verify-full
            - name: NODE_EXTRA_CA_CERTS
              value: /var/run/media-manager-postgres/ca.crt
            - name: IMAGE_ROOT
              value: /var/lib/media-manager/images
            - name: VIDEO_PREVIEW_MAX_BYTES
              value: "4294967296"
          ports:
            - name: web
              containerPort: 3000
          startupProbe:
            tcpSocket:
              port: web
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: web
            periodSeconds: 5
          volumeMounts: &runtime-mounts
            - *postgres-ca
            - name: images
              mountPath: /var/lib/media-manager/images
        - name: gateway
          image: media-manager-main
          args: [gateway]
          securityContext: *restricted
          env:
            - name: DATABASE_URI
              valueFrom:
                secretKeyRef:
                  name: media-manager-db-app
                  key: uri
            - name: DATABASE_URL
              value: $(DATABASE_URI)?sslmode=verify-full
            - name: NODE_EXTRA_CA_CERTS
              value: /var/run/media-manager-postgres/ca.crt
            - name: IMAGE_ROOT
              value: /var/lib/media-manager/images
            - name: AGENT_GATEWAY_HOST
              value: 0.0.0.0
            - name: VIDEO_PREVIEW_MAX_BYTES
              value: "4294967296"
          ports:
            - name: gateway
              containerPort: 4001
          startupProbe:
            tcpSocket:
              port: gateway
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: gateway
            periodSeconds: 5
          volumeMounts: *runtime-mounts
      volumes:
        - name: images
          persistentVolumeClaim:
            claimName: media-manager-images
        - name: postgres-ca
          secret:
            secretName: media-manager-db-ca
            items:
              - key: ca.crt
                path: ca.crt
