apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: n8n
resources:
  - ../../base/n8n/
  - secret-configmap.enc.yaml
  - cloudflare-secret.enc.yaml
  - ../../../shared/cloudflared/

images:
  - name: docker.n8n.io/n8nio/n8n
    newTag: "3.4.1@sha256:95f4fabd308669b35761ccf5b0d0a63526da06135e7e44d19d14694dbfd340be"

patches:
  - target:
      kind: PersistentVolumeClaim
      name: n8n-data-longhorn-backup-pvc
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 500Mi
  - target:
      kind: ConfigMap
      name: n8n-configmap
    patch: |-
      - op: replace
        path: /data/DB_POSTGRESDB_HOST
        value: n8n-db-staging-cluster-v2-rw.n8n.svc.cluster.local
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: n8n
      spec:
        template:
          metadata:
            annotations:
              colddev.net/database-cluster: n8n-db-staging-cluster-v2
