apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: media-manager-web
  annotations:
    tailscale.com/tags: tag:media-manager-staging
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: media-manager-web
      port:
        name: http
  tls:
    - hosts: [media-manager-staging]
