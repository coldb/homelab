apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-manager-agent
spec:
  # Enable one replica in Git after the Catalog Owner issues the staging token.
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: media-manager-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: media-manager-agent
      annotations:
        media-manager/release-tag: ${RELEASE_TAG}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: docker-registry-auth
      initContainers:
        - name: seed-media
          image: media-manager-agent
          securityContext: &restricted
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          command: [sh, -eu, -c]
          args:
            - |
              marker=/media/.media-manager-fixtures-v1
              if [ -f "$marker" ]; then
                exit 0
              fi
              mkdir -p /media/input /media/output
              if [ ! -e /media/input/test-card.mp4 ]; then
                scratch="$(mktemp -d /media/.seed.XXXXXX)"
                trap 'rm -rf "$scratch"' EXIT
                ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=160x90:rate=10 \
                  -t 1 -an -c:v libx264 -pix_fmt yuv420p "$scratch/test-card.mp4"
                ln "$scratch/test-card.mp4" /media/input/test-card.mp4
              fi
              touch "$marker"
          volumeMounts:
            - &media-mount
              name: media
              mountPath: /media
      containers:
        - name: agent
          image: media-manager-agent
          securityContext: *restricted
          env:
            - name: MAIN_APP_AGENT_GATEWAY_URL
              value: ws://${GATEWAY_SERVICE}:4001
            - name: AGENT_COMPUTER_DISPLAY_NAME
              value: Staging fixtures
            - name: AGENT_INPUT_BASE_PATHS
              value: '["/media/input"]'
            - name: AGENT_OUTPUT_BASE_PATHS
              value: '["/media/output"]'
            - name: AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: media-manager-agent
                  key: token
            - name: VIDEO_PREVIEW_MAX_BYTES
              value: "268435456"
          volumeMounts:
            - *media-mount
            - name: state
              mountPath: /config
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: media-manager-agent-media
        - name: state
          persistentVolumeClaim:
            claimName: media-manager-agent-state
