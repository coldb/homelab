apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: tailscale
  namespace: tailscale
spec:
  interval: 1h
  url: https://pkgs.tailscale.com/helmcharts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: media-manager-tailscale
  namespace: tailscale
spec:
  interval: 1h
  chart:
    spec:
      chart: tailscale-operator
      version: 1.104.7
      sourceRef:
        kind: HelmRepository
        name: tailscale
  values:
    # With OAuth values unset, the chart mounts media-manager-tailscale-oauth.
    fullnameOverride: media-manager-tailscale
    proxyConfig:
      image:
        tag: v1.104.7
