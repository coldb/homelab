apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/media-manager
patches:
  - patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: media-manager-tailscale
        namespace: tailscale
      spec:
        values:
          operatorConfig:
            hostname: media-manager-operator-staging
            defaultTags: ["tag:media-manager-operator-staging"]
          proxyConfig:
            defaultTags: tag:media-manager-staging
