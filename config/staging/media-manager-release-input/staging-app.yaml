apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: media-manager-staging-app
  namespace: flux-system
spec:
  dependsOn:
    - name: media-manager-staging-database
    - name: media-manager-staging-config
  interval: 1m
  retryInterval: 1m
  timeout: 5m
  path: ./apps/staging/media-manager
  prune: true
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: media-manager
      namespace: media-manager
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substitute:
      RELEASE_TAG: 0.0.${RELEASE_SEQUENCE}
      GATEWAY_SERVICE: mm-gw-${SOURCE_SHA}
      MAIN_DIGEST: ${MAIN_DIGEST}
      AGENT_DIGEST: ${AGENT_DIGEST}
