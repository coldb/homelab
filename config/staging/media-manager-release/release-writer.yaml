apiVersion: v1
kind: ServiceAccount
metadata:
  name: media-manager-staging-release
  namespace: flux-system
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: media-manager-staging-release
  namespace: flux-system
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [media-manager-staging-release]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: media-manager-staging-release
  namespace: flux-system
subjects:
  - kind: ServiceAccount
    name: media-manager-staging-release
    namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: media-manager-staging-release
