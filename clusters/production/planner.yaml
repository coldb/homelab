# Keep suspended until the Planner database secrets and S3 backup destination are ready.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: planner-config
  namespace: flux-system
spec:
  suspend: true
  dependsOn:
    - name: flux-system
    - name: config
  interval: 5m
  retryInterval: 1m
  timeout: 5m
  path: ./config/production/planner
  prune: false
  healthChecks:
    - apiVersion: v1
      kind: Secret
      name: aws-backup-credentials
      namespace: planner
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: planner-database
  namespace: flux-system
spec:
  suspend: true
  dependsOn:
    - name: flux-system
    - name: planner-config
    - name: infrastructure-controllers
  interval: 5m
  retryInterval: 1m
  timeout: 15m
  path: ./database/production/planner
  prune: false
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
