apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rocketchat
resources:
  - ../../base/rocketchat/
patches:
  - target:
      kind: PerconaServerMongoDB
      name: rocketchat-db-production-cluster-v1
    patch: |-
      - op: replace
        path: /spec/image
        value: percona/percona-server-mongodb:8.0.38-16@sha256:60ec65283ad2108622762910fc964ed4a2617efd05301c691dcb203a04566d97
      - op: replace
        path: /spec/replsets/0/affinity
        value:
          antiAffinityTopologyKey: kubernetes.io/hostname
      - op: replace
        path: /spec/replsets/0/sidecars/0/image
        value: percona/mongodb_exporter@sha256:afc6fe95557f506fcf9251f9363592c80abfedad506266d891db5d4c8d9be273
