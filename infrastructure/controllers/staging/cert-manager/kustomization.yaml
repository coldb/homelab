apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cert-manager
resources:
  - ../../base/cert-manager/
  - colddevnet-ca-secret.enc.yaml
  - cloudflare-api-token.enc.yaml

patches:
  - target:
      kind: HelmRelease
      name: cert-manager
    patch: |-
      - op: replace
        path: /spec/chart/spec/version
        value: "v1.19.6"
